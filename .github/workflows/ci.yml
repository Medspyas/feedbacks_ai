name: CI/CD pipeline

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install black flake8 pytest pytest-asyncio httpx

      - name: Lint with black
        run: black --check app/

      - name: Lint with flake8
        run: flake8 app/

      - name: Run tests
        run: pytest tests/
        env:
          MONGO_DB_URL: ${{ secrets.MONGO_DB_URL }}
          DB_NAME: ${{ secrets.DB_NAME }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install and lint
        run: cd frontend && npm ci --legacy-peer-deps && npm run lint
  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build + Push Backend
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/feedback-ai-backend:latest

      - name: Build + Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/feedback-ai-frontend:latest

  # Job de déploiement — s'exécute après que les images sont poussées sur Docker Hub
  deploy:
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4

      # Copie docker-compose.prod.yml et nginx.conf sur le serveur OCI
      - name: Copier les fichiers de config sur le serveur
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.OCI_SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          source: "docker-compose.prod.yml,nginx/nginx.conf"
          target: "/home/ubuntu/app"

      # Se connecte en SSH et lance les containers avec les dernières images
      - name: Déployer sur le serveur OCI
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OCI_SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          script: |
            cd /home/ubuntu/app

            # Crée le fichier .env avec les secrets GitHub
            echo "MONGO_DB_URL=${{ secrets.MONGO_DB_URL }}" > .env
            echo "DB_NAME=${{ secrets.DB_NAME }}" >> .env
            echo "GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}" >> .env
            echo "DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}" >> .env

            # Télécharge les dernières images et redémarre les containers
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d