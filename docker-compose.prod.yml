services:

  # Backend FastAPI — utilise l'image poussée sur Docker Hub par le CI
  backend:
    image: ${DOCKER_USERNAME}/feedback-ai-backend:latest
    restart: always
    env_file:
      - .env
    # Vérifie que le backend répond avant de démarrer les autres services
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend React — utilise l'image poussée sur Docker Hub par le CI
  frontend:
    image: ${DOCKER_USERNAME}/feedback-ai-frontend:latest
    restart: always
    depends_on:
      backend:
        condition: service_healthy

  # Nginx — point d'entrée unique, gère HTTP→HTTPS et reverse proxy
  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - backend
      - frontend

  # Certbot — renouvelle automatiquement le certificat SSL toutes les 12h
  certbot:
    image: certbot/certbot
    restart: always
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
