events {}

http {
    # Redirige tout le trafic HTTP vers HTTPS
    server {
        listen 80;
        server_name feedback-ai.duckdns.org;

        # Utilisé par Certbot pour valider le domaine (Let's Encrypt)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # Serveur principal HTTPS
    server {
        listen 443 ssl;
        server_name feedback-ai.duckdns.org;

        ssl_certificate /etc/letsencrypt/live/feedback-ai.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/feedback-ai.duckdns.org/privkey.pem;

        # Redirige les requêtes /api/ vers le backend FastAPI
        location /api/ {
            proxy_pass http://backend:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Health check backend
        location /health {
            proxy_pass http://backend:8000/health;
        }

        # Sert le frontend React
        location / {
            proxy_pass http://frontend:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
